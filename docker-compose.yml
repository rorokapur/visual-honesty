version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: visual-honesty-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-visual_honesty}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: visual-honesty-app
    restart: always
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-visual_honesty}
      DB_PORT: 5432
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - server_uploads:/app/uploads

  caddy:
    image: caddy:alpine
    container_name: visual-honesty-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - app

volumes:
  postgres_data:
  server_uploads:
  caddy_data:
